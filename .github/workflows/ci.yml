name: CI Almanak

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  validacao-qa:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: almanak_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Clonar o repositório
        uses: actions/checkout@v4

      - name: ⚙️ Checklist de Qualidade (QA)
        run: |
          echo "Iniciando validação do código..."
          echo "Atenção Front e Back: Quando tiverem testes automatizados, o QA vai habilitá-los aqui!"
      
