version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: almanak-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: almanak
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: 
      context: ./backend
    container_name: almanak-backend
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://admin:password123@db:5432/almanak
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: almanak-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
